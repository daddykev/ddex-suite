[package]
name = "ddex-builder"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "DDEX ERN XML builder (ERN 4.3, 4.2, 3.8.2) with DB-C14N/1.0 canonical output"
keywords = ["ddex", "ern", "xml", "builder", "music"]
categories = ["encoding", "multimedia::audio"]
documentation = "https://docs.rs/ddex-builder"
readme = "README.md"
homepage.workspace = true
rust-version.workspace = true
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
# Default features, as in CI (`cargo doc --no-deps --workspace --lib`).
features = []

[dependencies]
# Core dependency
ddex-core = { version = "0.5.1", path = "../core" }

# Deterministic collections (CRITICAL for determinism)
indexmap = { version = "2.5", features = ["serde"] }

# XML generation
quick-xml = { workspace = true }

# Core dependencies
thiserror = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
web-time = "1.1"

# ID generation
uuid = { workspace = true }
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"

# String operations
unicode-normalization = "0.1"
regex = "1.11"
once_cell = "1.19"
html-escape = "0.2"

# Validation
url = "2.5"
urlencoding = "2.1"

# CLI dependencies
clap = { version = "4.4", features = ["derive", "env", "color"] }
clap_complete = "4.4"
console = "0.15"

# File format support
serde_yaml = "0.9"
toml = { version = "0.8", features = ["preserve_order"] }

# Logging
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Optional features
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }
# Real parse -> build -> re-parse round-trip tests (tests/it/round_trip.rs)
ddex-parser = { path = "../ddex-parser" }

# Fidelity testing dependencies
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
regex = "1.11"

[features]
default = ["async"]
# `async`, `tokio` and `futures` are kept as empty features so existing `features = [...]`
# lists keep resolving. The optional tokio/futures dependencies they used to enable were never
# used by the library and were removed in 0.5.1; `tokio` and `futures` were their implicit
# features. (The async tests use the tokio dev-dependency.)
async = []
tokio = []
futures = []
strict = []  # Enable strict validation
bench = []
ffi = []  # Foreign Function Interface support
wasm = []  # WebAssembly support
performance-debug = []  # Enable performance logging and metrics output
# Test-only: timing sanity limits (about 10x the recorded timings; release mode only):
#   cargo test -p ddex-builder --release --features perf-tests
perf-tests = []

# Benchmarks
[[bench]]
name = "building"
harness = false

[[bench]]
name = "canonicalization"
harness = false

[[bench]]
name = "performance"
harness = false

[[bench]]
name = "determinism"
harness = false

[[bench]]
name = "security"
harness = false

# Binary target for CLI
[[bin]]
name = "ddex-builder"
path = "src/bin/ddex-builder.rs"
test = false  # the CLI has no unit tests

# Strict linting configuration to ensure determinism
[lints.clippy]
disallowed_types = "deny"
disallowed_methods = "deny"