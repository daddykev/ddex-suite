[package]
name = "ddex-builder-python"
version = "0.6.0"
edition = "2021"
authors = ["Kevin Marques Moo"]
license = "MIT"
publish = false
# pyo3 0.29 needs Rust 1.83 (the published crates stay at the workspace rust-version)
rust-version = "1.83"

[lib]
name = "ddex_builder"
crate-type = ["cdylib"]
# No Rust tests here; binding tests live in the package test suites (npm/pytest).
test = false
doctest = false
# Same lib name as the Rust crate it wraps (the Python module name); rustdoc would
# write both to target/doc/<name>, so only the Rust crate is documented.
doc = false

[dependencies]
ddex-builder = { path = "../..", features = ["ffi"] }
ddex-parser = { path = "../../../ddex-parser" }
ddex-core = { path = "../../../core" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { workspace = true }

[build-dependencies]
pyo3-build-config = "0.29"