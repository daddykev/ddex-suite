[package]
name = "ddex-builder-node"
version = "0.5.1"
edition = "2021"
authors = ["Kevin Marques Moo"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
# No Rust tests here; binding tests live in the package test suites (npm/pytest).
test = false
doctest = false

[dependencies]
ddex-builder = { path = "../..", features = ["ffi"] }
ddex-core = { path = "../../../core", features = ["typescript"] }
# The round-trip check (testRoundTripFidelity, buildWithFidelity verification) parses with it.
ddex-parser = { path = "../../../ddex-parser" }
napi = { version = "2", features = ["async", "serde-json", "tokio_rt"] }
napi-derive = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { workspace = true }

[build-dependencies]
napi-build = "2"
