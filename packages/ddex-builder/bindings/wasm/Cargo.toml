[package]
name = "ddex-builder-wasm"
version = "0.5.1"
edition = "2021"
authors = ["Kevin Marques Moo"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
# No Rust tests here; binding tests live in the package test suites (npm/pytest).
test = false
doctest = false

[dependencies]
ddex-builder = { path = "../..", features = ["wasm"], default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
html-escape = "0.2"
indexmap = "2.5"
# Utc::now() through js_sys::Date (without `wasmbind` it panics on wasm32-unknown-unknown)
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
# uuid v4 IDs through crypto.getRandomValues
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"


# Optimize for size
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
