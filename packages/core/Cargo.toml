[package]
name = "ddex-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared DDEX ERN data models (flat and graph) for ddex-parser and ddex-builder"
keywords = ["ddex", "ern", "xml", "music", "metadata"]
categories = ["data-structures", "multimedia::audio"]
documentation = "https://docs.rs/ddex-core"
readme = "README.md"
homepage.workspace = true
rust-version.workspace = true
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
# Default features, as in CI (`cargo doc --no-deps --workspace --lib`).
features = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
ts-rs = { version = "7.1", optional = true }
# Extension system dependencies
indexmap = { version = "2.5", features = ["serde"] }
html-escape = "0.2"
# Validation dependencies
url = "2.4"
regex = "1.10"

[features]
default = []
ffi = []
typescript = ["ts-rs"]