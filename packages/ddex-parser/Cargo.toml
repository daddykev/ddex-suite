# packages/ddex-parser/Cargo.toml (using workspace deps)
[package]
name = "ddex-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DDEX ERN XML parser (ERN 3.8.x, 4.2, 4.3) with a flat and a graph model"
keywords = ["ddex", "ern", "xml", "parser", "music"]
categories = ["parser-implementations", "multimedia::audio"]
documentation = "https://docs.rs/ddex-parser"
readme = "README.md"
homepage.workspace = true
rust-version.workspace = true
include = ["/src/**/*.rs", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
# Default features, as in CI (`cargo doc --no-deps --workspace --lib`).
features = []

[dependencies]
# Core dependency
ddex-core = { version = "0.5.0", path = "../core" }

# Use workspace dependencies
quick-xml = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Parser-specific dependencies not in workspace
memchr = "2.7"
indexmap = "2.5"

# Optional workspace dependencies
ts-rs = { workspace = true, optional = true }

# CLI dependencies
clap = { version = "4.4", features = ["derive", "env", "color", "suggestions"] }
clap_complete = "4.4"
env_logger = "0.11"
log = "0.4"
indicatif = "0.17"
colored = "2.1"
anyhow = "1.0"
rayon = "1.10"
glob = "0.3"
serde_yaml = "0.9"
rmp-serde = "1.3"
base64 = "0.22"
html-escape = "0.2"
num_cpus = "1.16"

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
test-case = { workspace = true }
insta = { workspace = true }

[features]
default = ["async"]
# `async`, `tokio` and `futures` are kept as empty features so existing `features = [...]`
# lists keep resolving. The optional tokio/futures dependencies they used to enable were never
# used by the crate and were removed in 0.5.1; `tokio` and `futures` were their implicit features.
async = []
tokio = []
futures = []
# cli feature not needed - dependencies are already included
typescript = ["ts-rs", "ddex-core/ts-rs"]
wasm = []  # WebAssembly support
simd = []
bench = []
zero-copy = []  # High-performance zero-copy streaming parser
performance-debug = []  # Enable performance logging and metrics output
# Test-only: timing sanity limits (about 10x the recorded timings; release mode only):
#   cargo test -p ddex-parser --release --features perf-tests
perf-tests = []
# Test-only: tests for streaming implementations slated for removal

# Binaries
[[bin]]
name = "ddex-parser"
path = "src/main.rs"
# main.rs re-declares the library modules, so its unit tests would duplicate the lib's.
test = false

[[bin]]
name = "generate-bench-report"
path = "src/bin/bench_report.rs"
test = false
required-features = ["async"]

# Benchmarks
[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "streaming"
harness = false

[[bench]]
name = "memory"
harness = false

# Profile configurations for optimized builds
# Development profile with some optimizations for faster tests
# Size-optimized profile for WASM

[[bench]]
name = "fast_streaming_benchmark"
harness = false
