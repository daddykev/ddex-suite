# packages/ddex-parser/bindings/python/Cargo.toml
[package]
name = "ddex-parser-python"
version = "0.5.0"
edition = "2021"
authors = ["Kevin Marques Moo"]
license = "MIT"
publish = false
# pyo3 0.29 needs Rust 1.83 (the published crates stay at the workspace rust-version)
rust-version = "1.83"

[lib]
name = "ddex_parser"
crate-type = ["cdylib"]
# No Rust tests here; binding tests live in the package test suites (npm/pytest).
test = false
doctest = false
# Same lib name as the Rust crate it wraps (the Python module name); rustdoc would
# write both to target/doc/<name>, so only the Rust crate is documented.
doc = false

[dependencies]
ddex-core = { path = "../../../core" }
ddex-parser = { path = "../.." }

pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
pythonize = "0.29"
numpy = { version = "0.29", optional = true }

[features]
default = ["dataframe"]
dataframe = ["numpy"]

[build-dependencies]
pyo3-build-config = "0.29"