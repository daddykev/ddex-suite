# ddex-suite/Cargo.toml (root)
[workspace]
members = [
    "packages/core",
    "packages/ddex-parser",
    "packages/ddex-builder",
    "packages/ddex-parser/bindings/node",
    "packages/ddex-builder/bindings/node",
    "packages/ddex-builder/bindings/python",
    "packages/ddex-builder/bindings/wasm",
    "packages/ddex-parser/bindings/python",
    "packages/ddex-parser/bindings/wasm",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Kevin Marques Moo"]
license = "MIT"
repository = "https://github.com/daddykev/ddex-suite"
homepage = "https://ddex-suite.org"
rust-version = "1.82"

[workspace.dependencies]
# Core dependencies
# 0.41: fixes RUSTSEC-2026-0194 / -0195; 0.42 needs Rust 1.86 (above rust-version)
quick-xml = "0.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
getrandom = { version = "0.2.16", features = ["js"] }
uuid = { version = "1.5", features = ["v4", "serde", "js"] }

# Optional/feature-gated dependencies
tokio = { version = "1.35", features = ["full"] }
ts-rs = "7.1"

# Development dependencies
criterion = "0.5"
tempfile = "3.8"
pretty_assertions = "1.4"
proptest = "1.4"
test-case = "3.1"
insta = "1.34"
walkdir = "2.4"
sha2 = "0.10"
hex = "0.4"
similar = "2.4"

# Bindings-specific
napi = "2"
napi-derive = "2"
pyo3 = "0.29"
wasm-bindgen = "0.2"

# Dev/test builds: keep line tables for backtraces in our crates, drop full
# debuginfo everywhere (dependencies get none) to keep target/ small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Profile configurations for optimized builds (moved from packages)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"

# Development profile with some optimizations for faster tests
[profile.dev-opt]
inherits = "dev"
opt-level = 1

# Size-optimized profile for WASM
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = true
panic = "abort"

