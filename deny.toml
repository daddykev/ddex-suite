# cargo-deny configuration (current format; checked in CI by the `cargo-deny` job).
# Run locally with `cargo deny check` (advisories, bans, licenses, sources).
#
# The workspace includes the Node, Python and WASM binding crates, so this one manifest
# covers everything that ships. Not covered: packages/ddex-builder/fuzz,
# benchmark-suite/rust and examples/perfect-fidelity (separate, unpublished manifests).

[graph]
# Check every feature (the CI action also passes --all-features), so optional
# dependencies such as dhat, ts-rs and numpy are included.
all-features = true

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerability advisories always fail the check. Unmaintained-crate advisories fail it
# for any crate in the graph; unsound ones too. Yanked versions are a warning.
unmaintained = "all"
unsound = "all"
yanked = "warn"
# Each ignore needs a reason, and an unresolved advisory also needs a KNOWN_ISSUES.md entry
# ("Unresolved dependency advisories"). Remove an entry when its upgrade lands.
ignore = [
    # Unmaintained crates with no maintained release to move to yet.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained: direct dependency of every crate (dates in the models); no drop-in replacement chosen yet" },
    { id = "RUSTSEC-2026-0249", reason = "smartstring is unmaintained: ddex-builder dependency; to be replaced" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix is unmaintained: pulled in by indicatif 0.17 (ddex-parser CLI progress bars); indicatif 0.18 drops it" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained: pulled in by rmp (rmp-serde, ddex-parser CLI MessagePack output); the advisory lists no safe upgrade" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained: pulled in by serde_yaml (deprecated; YAML input/output in the CLIs); to be replaced" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils is unmaintained: pulled in by futures-util (pyo3-async-runtimes 0.29, Python parser binding)" },
]

[licenses]
confidence-threshold = 0.8
# The licenses that occur in the dependency graph (for an `A OR B` expression, one
# allowed alternative is enough).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
]
# MPL-2.0 (file-level copyleft) is accepted only for these crates, used unmodified as
# dependencies.
exceptions = [
    { crate = "colored", allow = ["MPL-2.0"] }, # ddex-parser CLI output colors
    { crate = "smartstring", allow = ["MPL-2.0"] }, # ddex-builder (MPL-2.0+)
]

[bans]
# Duplicate versions are reported, not failed (several come from the Windows and rand
# ecosystems and from different requirements in the binding crates).
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { crate = "openssl", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
    { crate = "sha1", reason = "SHA-1 is cryptographically broken" },
    { crate = "md5", reason = "MD5 is cryptographically broken" },
    { crate = "md-5", reason = "MD5 is cryptographically broken" },
    { crate = "memmap", reason = "unmaintained; use memmap2" },
    { crate = "tempdir", reason = "unmaintained; use tempfile" },
    { crate = "yaml-rust", reason = "unmaintained" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
