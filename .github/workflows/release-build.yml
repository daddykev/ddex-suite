# Builds the release packages and uploads them as workflow artifacts: the three crates, the
# npm tarballs, the Python wheels and sdists, and a CycloneDX SBOM for each artifact family.
# Every artifact gets a signed build-provenance attestation, and each package its SBOM
# attestation (job `attest`), verifiable with
# `gh attestation verify <file> --repo daddykev/ddex-suite`.
# It does NOT publish anything: download the artifacts, verify them and publish those exact
# files by hand, as PUBLISH.md says.
name: Release build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- crates.io
  # The .crate files `cargo publish` uploads. cargo packages reproducibly (fixed mtimes),
  # so PUBLISH.md re-packages the same commit with the same cargo version, recorded in
  # cargo-version.txt, and publishes only if the checksums match these attested files.
  crates:
    name: crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Packaged together: ddex-parser and ddex-builder resolve the unpublished ddex-core
      # from the local package. Each crate is built from its .crate file (verify).
      - run: cargo package -p ddex-core -p ddex-parser -p ddex-builder
      - name: Record the cargo version and the checksums
        run: |
          set -euo pipefail
          cargo --version | tee target/package/cargo-version.txt
          (cd target/package && sha256sum *.crate)
      - uses: actions/upload-artifact@v7
        with:
          name: crates
          path: |
            target/package/*.crate
            target/package/cargo-version.txt
          if-no-files-found: error

  # ---------------------------------------------------------------- SBOMs
  # CycloneDX 1.5 JSON from Cargo.lock (cargo-cyclonedx, all targets), one per shipped
  # artifact family: the three crates, the Rust crate compiled into each npm package's
  # native binaries (the npm packages have no npm dependencies besides their own platform
  # packages) and the one compiled into each Python wheel (the Python packages have no
  # required dependencies). An sdist is the source of the same crate as its wheels.
  sbom:
    name: SBOMs (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-cyclonedx --locked --version 0.5.10
      - name: Generate
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5 --target all --override-filename sbom
          mkdir -p sbom
          for pair in \
            ddex-core:packages/core \
            ddex-parser:packages/ddex-parser \
            ddex-builder:packages/ddex-builder \
            ddex-parser-node:packages/ddex-parser/bindings/node \
            ddex-builder-node:packages/ddex-builder/bindings/node \
            ddex-parser-python:packages/ddex-parser/bindings/python \
            ddex-builder-python:packages/ddex-builder/bindings/python; do
            name="${pair%%:*}" dir="${pair#*:}"
            file="$(ls "$dir"/sbom*.json)"
            python3 -c 'import json, sys; b = json.load(open(sys.argv[1])); c = b["metadata"]["component"]; assert c["name"] == sys.argv[2], c["name"]; print(sys.argv[2], c["version"], len(b.get("components", [])), "components")' "$file" "$name"
            cp "$file" "sbom/$name.cdx.json"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------- PyPI
  # macOS: both wheels build on macos-latest (Apple Silicon); x86_64 is cross-compiled there,
  # as GitHub's last Intel image (macos-15-intel) is retired in August 2027. Each macOS
  # wheel's native extension is checked with lipo for the expected architecture.
  wheels:
    name: wheel ${{ matrix.package }} ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: [ddex-parser, ddex-builder]
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64-apple-darwin, arch: x86_64 }
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin, arch: arm64 }
          - { name: windows-x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      # abi3-py310 (the pyo3 feature): one cp310-abi3 wheel per platform for Python 3.10+.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/${{ matrix.package }}/bindings/python
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --out dist
      - name: Check the native extension's architecture (macOS)
        if: ${{ matrix.platform.arch }}
        working-directory: packages/${{ matrix.package }}/bindings/python
        env:
          ARCH: ${{ matrix.platform.arch }}
        run: |
          set -euo pipefail
          for whl in dist/*.whl; do
            rm -rf "$RUNNER_TEMP/whl" && mkdir -p "$RUNNER_TEMP/whl"
            unzip -q "$whl" -d "$RUNNER_TEMP/whl"
            for so in "$RUNNER_TEMP"/whl/ddex_*/_internal*.so; do
              file "$so"
              archs="$(lipo -archs "$so")"
              [ "$archs" = "$ARCH" ] || { echo "$so: architectures '$archs', expected '$ARCH'"; exit 1; }
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.package }}-${{ matrix.platform.name }}
          path: packages/${{ matrix.package }}/bindings/python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [ddex-parser, ddex-builder]
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/${{ matrix.package }}/bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist-${{ matrix.package }}
          path: packages/${{ matrix.package }}/bindings/python/dist/*.tar.gz
          if-no-files-found: error

  # Install each wheel on a matching runner with the oldest supported Python (3.10): import
  # it and parse (or build) with an official sample. The musllinux wheel is tested in an
  # Alpine container. The macOS x86_64 wheel is tested on macos-latest (Apple Silicon) with
  # python.org's universal2 Python 3.10 running as x86_64 under Rosetta 2.
  wheel-install-test:
    name: install-test wheel ${{ matrix.platform.name }}
    needs: wheels
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-latest }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm }
          - { name: musllinux-x86_64, runner: ubuntu-latest, container: "python:3.10-alpine" }
          - { name: macos-x86_64, runner: macos-latest, arch: x64, machine: x86_64 }
          - { name: macos-arm64, runner: macos-latest, machine: arm64 }
          - { name: windows-x64, runner: windows-latest }
    container: ${{ matrix.platform.container || '' }}
    steps:
      - uses: actions/checkout@v7
      # python:3.10-alpine has no bash, which the steps below use.
      - name: Install bash (Alpine)
        if: ${{ matrix.platform.container }}
        shell: sh
        run: apk add --no-cache bash
      - uses: actions/setup-python@v7
        if: ${{ !matrix.platform.container && !matrix.platform.arch }}
        with:
          python-version: "3.10"
      # macOS x86_64 on Apple Silicon: setup-python's darwin-x64 Python links Intel Homebrew
      # libraries (/usr/local/opt/gettext) that the runner does not have. python.org's
      # universal2 installer is self-contained; a venv of it, run through `arch -x86_64`,
      # is the x86_64 `python` for the steps below.
      - name: x86_64 Python 3.10 under Rosetta 2 (python.org universal2)
        if: ${{ matrix.platform.arch == 'x64' }}
        run: |
          set -euo pipefail
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          curl -fsSLo "$RUNNER_TEMP/python.pkg" https://www.python.org/ftp/python/3.10.11/python-3.10.11-macos11.pkg
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.10/bin/python3.10 -m venv "$RUNNER_TEMP/venv-x86_64"
          mkdir -p "$RUNNER_TEMP/bin-x86_64"
          printf '#!/bin/sh\nexec arch -x86_64 "%s/venv-x86_64/bin/python" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/bin-x86_64/python"
          chmod +x "$RUNNER_TEMP/bin-x86_64/python"
          echo "$RUNNER_TEMP/bin-x86_64" >> "$GITHUB_PATH"
      - name: Check the interpreter's architecture
        if: ${{ matrix.platform.machine }}
        env:
          MACHINE: ${{ matrix.platform.machine }}
        run: |
          python -c "import platform, sys; print(platform.machine(), sys.version)"
          test "$(python -c 'import platform; print(platform.machine())')" = "$MACHINE"
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*-${{ matrix.platform.name }}
          path: wheels
          merge-multiple: true
      - name: Install the wheels (no index access)
        shell: bash
        run: python -m pip install --no-index --find-links wheels ddex-parser ddex-builder
      - name: Import, parse and build
        shell: bash
        run: python scripts/release_smoke.py "examples/Samples43/1 Audio.xml"

  sdist-install-test:
    name: install-test sdist
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: sdist-*
          path: sdist
          merge-multiple: true
      - name: Build and install from the sdists
        run: python -m pip install sdist/*.tar.gz
      - name: Import, parse and build
        run: python scripts/release_smoke.py "examples/Samples43/1 Audio.xml"

  # The README renders on PyPI (twine check --strict) and each wheel / sdist holds what it
  # should: the package modules and the native extension, no caches or build leftovers.
  pypi-check:
    name: twine check and contents
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: "{wheel,sdist}-*"
          path: dist
          merge-multiple: true
      - run: python -m pip install twine
      - name: twine check --strict
        run: twine check --strict dist/*
      - name: Contents
        run: |
          set -euo pipefail
          for f in dist/*.whl; do
            case "$f" in *-cp310-abi3-*) ;; *) echo "$f is not a cp310-abi3 wheel"; exit 1;; esac
            echo "== $f"; python -m zipfile -l "$f" | awk 'NR>1 {print $1}' | tee files.txt
            if grep -E '__pycache__|\.pyc$' files.txt; then echo "build leftovers in $f"; exit 1; fi
            grep -E '^ddex_(parser|builder)/_internal\.' files.txt >/dev/null || { echo "no native extension in $f"; exit 1; }
          done
          for f in dist/*.tar.gz; do
            echo "== $f ($(tar -tzf "$f" | wc -l) files)"
            if tar -tzf "$f" | grep -E '__pycache__|\.pyc$|/target/|/node_modules/'; then echo "leftovers in $f"; exit 1; fi
          done

  # ---------------------------------------------------------------- npm
  # macOS: both binaries build on macos-latest (Apple Silicon); darwin-x64 is cross-compiled
  # and checked with lipo (see the wheels job).
  node-binaries:
    name: node ${{ matrix.package }} ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: [ddex-parser, ddex-builder]
        platform:
          - { name: darwin-arm64, runner: macos-latest, target: aarch64-apple-darwin, arch: arm64 }
          - { name: darwin-x64, runner: macos-latest, target: x86_64-apple-darwin, arch: x86_64 }
          - { name: linux-x64-gnu, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: win32-x64-msvc, runner: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
        working-directory: packages/${{ matrix.package }}/bindings/node
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund  # package-lock.json is not tracked
      - name: Build the native binary
        run: npx napi build --platform --release --target ${{ matrix.platform.target }}
      - name: Check the binary's architecture (macOS)
        if: ${{ matrix.platform.arch }}
        env:
          ARCH: ${{ matrix.platform.arch }}
          NODE_FILE: ${{ matrix.package }}-node.${{ matrix.platform.name }}.node
        run: |
          file "$NODE_FILE"
          archs="$(lipo -archs "$NODE_FILE")"
          [ "$archs" = "$ARCH" ] || { echo "$NODE_FILE: architectures '$archs', expected '$ARCH'"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.package }}-${{ matrix.platform.name }}
          path: packages/${{ matrix.package }}/bindings/node/*.${{ matrix.platform.name }}.node
          if-no-files-found: error

  # Installs the npm-packages tarballs (the ones attested and published) for this platform.
  # darwin-x64 is tested on macos-latest (Apple Silicon) with an x64 Node under Rosetta 2.
  node-install-test:
    name: install-test node ${{ matrix.platform.name }}
    needs: npm-packages
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: darwin-arm64, runner: macos-latest, node-arch: arm64 }
          - { name: darwin-x64, runner: macos-latest, arch: x64, node-arch: x64 }
          - { name: linux-x64-gnu, runner: ubuntu-latest }
          - { name: win32-x64-msvc, runner: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Rosetta 2
        if: ${{ matrix.platform.arch == 'x64' }}
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          architecture: ${{ matrix.platform.arch || '' }}
      - name: Check Node's architecture
        if: ${{ matrix.platform.node-arch }}
        env:
          NODE_ARCH: ${{ matrix.platform.node-arch }}
        run: |
          node -p process.arch
          test "$(node -p process.arch)" = "$NODE_ARCH"
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: ${{ runner.temp }}/packs
      # Each package's main tarball and its platform tarball: what a user gets from npm on
      # this platform.
      - name: Install the platform and main packages
        env:
          PLATFORM: ${{ matrix.platform.name }}
        run: |
          set -euo pipefail
          packs="$RUNNER_TEMP/packs"
          mkdir -p "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            "$packs"/ddex-parser-[0-9]*.tgz "$packs/ddex-parser-$PLATFORM"-[0-9]*.tgz \
            "$packs"/ddex-builder-[0-9]*.tgz "$packs/ddex-builder-$PLATFORM"-[0-9]*.tgz
      - name: Import, parse and build
        working-directory: ${{ runner.temp }}/app
        run: node "$GITHUB_WORKSPACE/scripts/release_smoke.js" "$GITHUB_WORKSPACE/examples/Samples43/1 Audio.xml"

  # Pack every npm package the release publishes (the two main packages and the eight
  # platform packages, each with its binary), check each tarball's exact file list and
  # upload them: these tarballs are what `npm publish <tarball>` publishes.
  npm-packages:
    name: npm packages (pack, check contents)
    needs: node-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          pattern: node-*
          path: binaries
          merge-multiple: true
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p packs
          for pkg in ddex-parser ddex-builder; do
            dir="packages/$pkg/bindings/node"
            for platform in darwin-arm64 darwin-x64 linux-x64-gnu win32-x64-msvc; do
              cp "binaries/$pkg-node.$platform.node" "$dir/npm/$platform/"
              npm pack "./$dir/npm/$platform" --ignore-scripts --pack-destination packs
            done
            npm pack "./$dir" --ignore-scripts --pack-destination packs
          done
      - name: Check the tarballs
        run: python3 scripts/check_npm_packs.py packs --version "$(node -p "require('./packages/ddex-parser/bindings/node/package.json').version")"
      - name: Checksums
        run: (cd packs && sha256sum *.tgz)
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: packs/*.tgz
          if-no-files-found: error

  # ---------------------------------------------------------------- attestations
  # Signed (Sigstore, GitHub's public-good instance) attestations, stored in the
  # repository's attestations: SLSA build provenance for every file the workflow produces,
  # and an SBOM attestation binding each package to its family's SBOM. Verify a file with
  #   gh attestation verify <file> --repo daddykev/ddex-suite
  # (scripts/verify_release_artifacts.sh verifies a whole download). This is the only job
  # with id-token / attestations write access.
  attest:
    name: attest provenance and SBOMs
    needs: [crates, sbom, wheels, sdist, node-binaries, npm-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Files to attest
        run: find artifacts -type f | sort
      - name: Build provenance (every artifact)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/crates/*.crate
            artifacts/crates/cargo-version.txt
            artifacts/npm-packages/*.tgz
            artifacts/node-*/*.node
            artifacts/wheel-*/*.whl
            artifacts/sdist-*/*.tar.gz
            artifacts/sbom/*.cdx.json
      # One SBOM attestation per family (actions/attest with sbom-path; actions/attest-sbom
      # is deprecated in its favour).
      - name: SBOM ddex-core crate
        uses: actions/attest@v4
        with:
          subject-path: artifacts/crates/ddex-core-*.crate
          sbom-path: artifacts/sbom/ddex-core.cdx.json
      - name: SBOM ddex-parser crate
        uses: actions/attest@v4
        with:
          subject-path: artifacts/crates/ddex-parser-*.crate
          sbom-path: artifacts/sbom/ddex-parser.cdx.json
      - name: SBOM ddex-builder crate
        uses: actions/attest@v4
        with:
          subject-path: artifacts/crates/ddex-builder-*.crate
          sbom-path: artifacts/sbom/ddex-builder.cdx.json
      - name: SBOM ddex-parser npm packages
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/npm-packages/ddex-parser-*.tgz
            artifacts/node-ddex-parser-*/*.node
          sbom-path: artifacts/sbom/ddex-parser-node.cdx.json
      - name: SBOM ddex-builder npm packages
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/npm-packages/ddex-builder-*.tgz
            artifacts/node-ddex-builder-*/*.node
          sbom-path: artifacts/sbom/ddex-builder-node.cdx.json
      - name: SBOM ddex-parser Python wheels and sdist
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/wheel-ddex-parser-*/*.whl
            artifacts/sdist-ddex-parser/*.tar.gz
          sbom-path: artifacts/sbom/ddex-parser-python.cdx.json
      - name: SBOM ddex-builder Python wheels and sdist
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/wheel-ddex-builder-*/*.whl
            artifacts/sdist-ddex-builder/*.tar.gz
          sbom-path: artifacts/sbom/ddex-builder-python.cdx.json
